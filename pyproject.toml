[project]
name = "script-yugioh-maker"
version = "0.1.0"
description = "Automacao (Playwright) que busca dados oficiais de cartas Yu-Gi-Oh! na API YGOPRODeck e preenche o yugiohcardmaker.org pra gerar a imagem da carta"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pyfiglet>=1.0.4",
    "python-dotenv>=1.2.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "term-image>=0.7.2",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
